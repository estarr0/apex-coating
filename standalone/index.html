  <script>

  <style>
    :root { color-scheme: light; }
    html.dark { color-scheme: dark; }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#f7f8fa; color:#0A1B3D; }
    html.dark body { background:#081329; color:#f8fafc; }
    .app-shell { min-height:100vh; }
    .glass { background:rgba(255,255,255,.88); backdrop-filter:blur(18px); }
    html.dark .glass { background:rgba(8,19,41,.88); }
    .card { border:1px solid rgba(148,163,184,.2); box-shadow:0 14px 40px rgba(10,27,61,.08); }
    html.dark .card { border-color:rgba(148,163,184,.18); box-shadow:0 14px 40px rgba(0,0,0,.2); }
    .modal-backdrop { background:rgba(2,8,23,.64); backdrop-filter:blur(8px); }
    .drawer { animation:drawer-in .22s ease-out; }
    @keyframes drawer-in { from { transform:translateX(100%); } to { transform:translateX(0); } }
    .swatch { transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .swatch:hover { transform:translateY(-2px); }
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .hero-grid { background-image:linear-gradient(rgba(10,27,61,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(10,27,61,.08) 1px,transparent 1px); background-size:28px 28px; }
    html.dark .hero-grid { background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px); }
    button:active { transform:scale(.98); }
  </style>

    function mixerSection(){
      const blend=blendedColor(), match=closestMatch(blend);
      return `<section id="mixer" class="py-16 sm:py-24 bg-slate-50 dark:bg-[#081329]"><div class="max-w-7xl mx-auto px-4 sm:px-6"><div class="mb-8"><div class="text-[10px] font-mono uppercase tracking-[.24em] text-signal">03 / Custom colour mixer</div><h2 class="mt-2 text-3xl sm:text-5xl font-black text-apex dark:text-white">Build a custom blend.</h2><p class="mt-3 text-slate-600 dark:text-slate-400 max-w-2xl">Adjust colour ratios, add your own HEX shade, and see the closest BS 4800 match.</p></div><div class="grid lg:grid-cols-[1.1fr_.9fr] gap-6"><div class="card rounded-2xl bg-white dark:bg-slate-900 p-5"><div class="flex items-center justify-between mb-4"><h3 class="font-black text-apex dark:text-white">Mixer colours</h3><button data-mixer-add class="px-3 py-2 rounded-lg bg-apex text-white text-xs font-bold">+ Add colour</button></div><div class="space-y-3">${state.mixer.map((m,i)=>`<div class="flex items-center gap-2 p-3 rounded-xl bg-slate-50 dark:bg-slate-800"><input data-mixer-hex="${i}" type="color" value="${esc(m.hex)}" class="w-9 h-9 rounded-lg"><input data-mixer-name="${i}" value="${esc(m.name)}" class="min-w-0 flex-1 px-2 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs"><button data-mixer-minus="${i}" class="w-7 h-7 rounded-md border">−</button><input data-mixer-weight="${i}" type="range" min="0" max="100" value="${m.weight}" class="w-24"><button data-mixer-plus="${i}" class="w-7 h-7 rounded-md border">+</button><button data-mixer-remove="${i}" class="text-red-500">×</button></div>`).join('')}</div><div class="mt-5 pt-5 border-t border-slate-100 dark:border-slate-800 flex gap-2"><input id="custom-name" placeholder="Custom name" class="flex-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm"><input id="custom-hex" placeholder="#HEX" class="w-24 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm font-mono"><button data-mixer-custom class="px-4 py-2 rounded-lg bg-apex text-white text-sm font-bold">Add</button></div></div><div class="card rounded-2xl bg-white dark:bg-slate-900 p-5"><div class="text-[10px] uppercase tracking-[.2em] text-slate-400 font-mono">Your blend</div><div class="mt-3 h-44 rounded-2xl border border-slate-200 dark:border-slate-700" style="background:${blend}"></div><div class="mt-3 text-2xl font-black font-mono text-apex dark:text-white">${blend.toUpperCase()}</div><div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-800"><div class="text-[10px] uppercase tracking-[.2em] text-slate-400 font-mono">Closest catalog match</div><div class="mt-3 flex items-center gap-3"><div class="w-14 h-14 rounded-xl" style="background:${match.shade.hex}"></div><div><div class="font-mono font-bold text-apex dark:text-white">${esc(match.shade.code)}</div><div class="text-sm text-slate-500">${esc(match.shade.name)} · ${match.pct}% match</div></div></div><button data-mixer-order class="mt-6 w-full py-3 rounded-xl bg-apex text-white font-bold">Order this blend</button></div></div></div></div></section>`;
    }
    function about(){ return `<section id="about" class="py-16 sm:py-24 bg-white dark:bg-[#0A1B3D]"><div class="max-w-7xl mx-auto px-4 sm:px-6 grid lg:grid-cols-2 gap-10 items-center"><div><div class="text-[10px] font-mono uppercase tracking-[.24em] text-signal">04 / Apex Coating E.A. Ltd</div><h2 class="mt-2 text-3xl sm:text-5xl font-black text-apex dark:text-white">Built for the surfaces that shape Nairobi.</h2><p class="mt-5 text-slate-600 dark:text-slate-300 leading-relaxed">From decorative emulsions and gloss systems to adhesives, thinners, road marking and industrial coatings, Apex and Premier Coat support practical specification with a local, responsive team.</p><div class="mt-6 grid sm:grid-cols-2 gap-3"><div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-900"><div class="font-black text-apex dark:text-white">Industrial Area</div><div class="text-sm text-slate-500 mt-1">Lusingeti Road, Nairobi</div></div><div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-900"><div class="font-black text-apex dark:text-white">Open 7:30—17:30</div><div class="text-sm text-slate-500 mt-1">Monday to Friday</div></div></div></div><div class="rounded-3xl bg-apex p-8 text-white"><div class="text-[10px] font-mono uppercase tracking-[.2em] text-blue-200">Two brands. One commitment.</div><div class="mt-8 text-4xl font-black">APEX × PREMIER</div><div class="mt-4 text-blue-100">Call +254 722 252 134 or send your configured order directly through WhatsApp.</div><a href="https://wa.me/${WHATSAPP}" target="_blank" class="inline-block mt-7 px-5 py-3 rounded-xl bg-white text-apex font-bold">Talk to the team</a></div></div></section>`; }
    function footer(){ return `<footer class="bg-[#061027] text-white"><div class="max-w-7xl mx-auto px-4 sm:px-6 py-10 flex flex-col sm:flex-row justify-between gap-5"><div><div class="font-black text-xl">APEX COATING E.A. LTD</div><div class="mt-2 text-sm text-blue-200">Colours true to nature.</div></div><div class="text-sm text-blue-200">Lusingeti Road, Industrial Area, Nairobi · +254 722 252 134 · c-care@apexcoating.co.ke</div></div></footer>`; }
    function shadeModal(){
      if(!state.shadeModalProduct)return '';
      const p=productById(state.shadeModalProduct), shades=SHADES.filter(s=>!state.shadeQuery||`${s.code} ${s.name} ${s.family}`.toLowerCase().includes(state.shadeQuery.toLowerCase()));
      return `<div class="fixed inset-0 z-50 modal-backdrop grid place-items-center p-4" data-close-modal><div class="w-full max-w-3xl max-h-[88vh] overflow-hidden rounded-2xl bg-white dark:bg-slate-900" onclick="event.stopPropagation()"><div class="p-5 bg-apex text-white flex justify-between"><div><div class="text-xs uppercase tracking-wider text-blue-200">Choose shade</div><h3 class="text-xl font-black">${esc(p.name)}</h3></div><button data-close-shade class="text-2xl">×</button></div><div class="p-5"><input id="modal-shade-search" value="${esc(state.shadeQuery)}" placeholder="Search by code or shade name" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 mb-4"><div class="max-h-[52vh] overflow-y-auto grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-2">${shades.map((s,i)=>`<button data-pick-shade="${i}" class="text-left rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 hover:border-signal"><div class="h-16" style="background:${s.hex}"></div><div class="p-2"><div class="font-mono text-[10px] font-bold">${esc(s.code)}</div><div class="text-[11px] text-slate-500 truncate">${esc(s.name)}</div></div></button>`).join('')}</div></div></div></div>`;
    }
    function coverageModal(){
      if(!state.coverageProduct)return '';
      const p=productById(state.coverageProduct);
      return `<div class="fixed inset-0 z-50 modal-backdrop grid place-items-center p-4" data-close-modal><div class="w-full max-w-md rounded-2xl bg-white dark:bg-slate-900 p-6" onclick="event.stopPropagation()"><div class="flex justify-between items-start"><div><div class="text-[10px] uppercase tracking-wider font-mono text-signal">Coverage calculator</div><h3 class="mt-1 text-xl font-black text-apex dark:text-white">${esc(p.name)}</h3></div><button data-close-calc class="text-2xl">×</button></div><div class="grid grid-cols-2 gap-3 mt-6"><label class="text-sm text-slate-500">Wall width (m)<input id="wall-width" type="number" min="0" step="0.1" value="4" class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800"></label><label class="text-sm text-slate-500">Wall height (m)<input id="wall-height" type="number" min="0" step="0.1" value="3" class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800"></label></div><div id="coverage-result" class="mt-5 p-4 rounded-xl bg-slate-50 dark:bg-slate-800 text-sm text-slate-600 dark:text-slate-300">Enter dimensions to calculate.</div><button data-calc-run class="mt-4 w-full py-3 rounded-xl bg-apex text-white font-bold">Calculate coverage</button></div></div>`;
    }
    function cartDrawer(){
      if(!state.cartOpen)return '';
      return `<div class="fixed inset-0 z-50 bg-black/50" data-close-cart><aside class="drawer ml-auto h-full w-full max-w-lg bg-white dark:bg-slate-900 shadow-2xl flex flex-col" onclick="event.stopPropagation()"><div class="p-5 bg-apex text-white flex items-center justify-between"><div><h2 class="text-xl font-black">Your cart</h2><div class="text-xs text-blue-200">${state.cart.reduce((a,i)=>a+i.quantity,0)} item(s)</div></div><button data-close-cart class="text-2xl">×</button></div><div class="flex-1 overflow-y-auto p-5 space-y-3">${state.cart.length?state.cart.map(i=>`<div class="p-4 rounded-xl border border-slate-200 dark:border-slate-700"><div class="flex gap-3"><img src="${esc(i.productImage)}" class="w-16 h-16 object-cover rounded-lg bg-slate-100"><div class="min-w-0 flex-1"><div class="font-black text-apex dark:text-white">${esc(i.productName)}</div><div class="text-xs text-slate-500 mt-1">${esc(i.colorName)} · ${esc(i.bsCode)} · ${esc(i.sizeVolume)}</div><div class="text-xs text-slate-500">${esc(i.finishType)}</div><div class="mt-2 flex items-center justify-between"><div class="flex items-center gap-2"><button data-qty="${i.id}|-1" class="w-7 h-7 rounded-md border">−</button><span>${i.quantity}</span><button data-qty="${i.id}|1" class="w-7 h-7 rounded-md border">+</button></div><b class="text-apex dark:text-white">${money(i.price*i.quantity)}</b></div></div></div><button data-remove="${i.id}" class="mt-2 text-xs text-red-500">Remove</button></div>`).join(''):'<div class="py-20 text-center text-slate-500">Your cart is empty.</div>'}</div>${state.cart.length?`<div class="p-5 border-t border-slate-200 dark:border-slate-700"><div class="flex justify-between items-center"><span class="text-slate-500">Order total</span><b class="text-2xl text-apex dark:text-white">${money(cartSubtotal())}</b></div><div class="mt-4 grid gap-2"><button data-whatsapp class="py-3 rounded-xl bg-[#25D366] text-white font-bold">Send via WhatsApp</button><button data-email class="py-3 rounded-xl bg-apex text-white font-bold">Request official quote</button></div><p class="mt-3 text-[11px] text-slate-400">Delivery and fulfilment details will be confirmed directly by the team.</p></div>`:''}</aside></div>`;
    }
    function render(){
      document.documentElement.classList.toggle('dark', state.dark); persist();
      document.getElementById('app').innerHTML = layout(hero()+catalog()+shadeSection()+solidVisualizer()+mixerSection()+about()+footer()+shadeModal()+coverageModal()+cartDrawer());
      bind();
    }
    function bind(){
      document.querySelector('[data-action="theme"]')?.addEventListener('click',()=>{state.dark=!state.dark;render();});
      document.querySelector('[data-action="cart"]')?.addEventListener('click',()=>{state.cartOpen=true;render();});
      document.getElementById('product-search')?.addEventListener('input',e=>{state.productQuery=e.target.value;render();const el=document.getElementById('product-search');el?.focus();el?.setSelectionRange(state.productQuery.length,state.productQuery.length);});
      document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{state.category=b.dataset.category;render();}));
      document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{const [id,label]=b.dataset.size.split('|');state.selectedSizes[id]=label;render();}));
      document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{const p=productById(b.dataset.add);addToCart(p,selectedShade(p),selectedSize(p));}));
      document.querySelectorAll('[data-shade]').forEach(b=>b.addEventListener('click',()=>{state.shadeModalProduct=b.dataset.shade;state.shadeQuery='';render();}));
      document.querySelectorAll('[data-family]').forEach(b=>b.addEventListener('click',()=>{state.shadeFamily=b.dataset.family;render();}));
      document.getElementById('shade-search')?.addEventListener('input',e=>{state.shadeQuery=e.target.value;render();});
      document.querySelectorAll('[data-swatch]').forEach(b=>b.addEventListener('click',()=>{const visible=SHADES.filter(s=>(state.shadeFamily==='All'||s.family===state.shadeFamily)&&(!state.shadeQuery||`${s.code} ${s.name} ${s.family}`.toLowerCase().includes(state.shadeQuery.toLowerCase())));const s=visible[Number(b.dataset.swatch)];if(s){state.selectedColors['plastic-emulsion']=s;state.visualizerShade=s;state.shadeModalProduct='plastic-emulsion';render();}}));
      document.getElementById('modal-shade-search')?.addEventListener('input',e=>{state.shadeQuery=e.target.value;render();});
      document.querySelectorAll('[data-pick-shade]').forEach(b=>b.addEventListener('click',()=>{const p=productById(state.shadeModalProduct);const visible=SHADES.filter(s=>!state.shadeQuery||`${s.code} ${s.name} ${s.family}`.toLowerCase().includes(state.shadeQuery.toLowerCase()));state.selectedColors[p.id]=visible[Number(b.dataset.pickShade)];state.visualizerShade=visible[Number(b.dataset.pickShade)];state.shadeModalProduct=null;state.shadeQuery='';render();}));
      document.querySelectorAll('[data-close-shade]').forEach(b=>b.addEventListener('click',()=>{state.shadeModalProduct=null;render();}));
      document.querySelectorAll('[data-calc]').forEach(b=>b.addEventListener('click',()=>{state.coverageProduct=b.dataset.calc;render();}));
      document.querySelectorAll('[data-close-calc]').forEach(b=>b.addEventListener('click',()=>{state.coverageProduct=null;render();}));
      document.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click',()=>{state.coverageProduct=null;state.shadeModalProduct=null;render();}));
      document.querySelector('[data-calc-run]')?.addEventListener('click',()=>{const w=Number(document.getElementById('wall-width').value)||0,h=Number(document.getElementById('wall-height').value)||0,area=w*h,liters=Math.ceil(area/12),p=productById(state.coverageProduct),size=p.sizes.find(s=>parseFloat(s.label) >= liters) || p.sizes[p.sizes.length-1], result=document.getElementById('coverage-result');result.innerHTML=`<b>${area.toFixed(1)} m²</b> wall area needs approximately <b>${liters}L</b> at 12 m²/L. Recommended: <b>${esc(size.label)}</b> · ${money(size.price)}.`;});
      document.querySelectorAll('[data-qty]').forEach(b=>{const [id,delta]=b.dataset.qty.split('|');b.addEventListener('click',()=>updateQty(id,Number(delta)));});
      document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>removeCart(b.dataset.remove)));
      document.querySelectorAll('[data-close-cart]').forEach(b=>b.addEventListener('click',()=>{state.cartOpen=false;render();}));
      document.querySelector('[data-whatsapp]')?.addEventListener('click',checkoutWhatsApp);
      document.querySelector('[data-email]')?.addEventListener('click',emailOrder);
      document.querySelector('[data-mixer-add]')?.addEventListener('click',()=>{if(state.mixer.length<5){state.mixer.push({name:`Custom ${state.mixer.length+1}`,hex:'#88b868',weight:50});render();}});
      document.querySelectorAll('[data-mixer-hex]').forEach(e=>e.addEventListener('input',()=>{state.mixer[Number(e.dataset.mixerHex)].hex=e.value;render();}));
      document.querySelectorAll('[data-mixer-name]').forEach(e=>e.addEventListener('input',()=>{state.mixer[Number(e.dataset.mixerName)].name=e.value;render();}));
      document.querySelectorAll('[data-mixer-weight]').forEach(e=>e.addEventListener('input',()=>{state.mixer[Number(e.dataset.mixerWeight)].weight=Number(e.value);render();}));
      document.querySelectorAll('[data-mixer-minus]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.mixerMinus);state.mixer[i].weight=Math.max(0,state.mixer[i].weight-10);render();}));
      document.querySelectorAll('[data-mixer-plus]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.mixerPlus);state.mixer[i].weight=Math.min(100,state.mixer[i].weight+10);render();}));
      document.querySelectorAll('[data-mixer-remove]').forEach(b=>b.addEventListener('click',()=>{if(state.mixer.length>1){state.mixer.splice(Number(b.dataset.mixerRemove),1);render();}}));
      document.querySelector('[data-mixer-custom]')?.addEventListener('click',()=>{const h=document.getElementById('custom-hex').value.trim();if(/^#?[0-9a-fA-F]{6}$/.test(h)){state.mixer.push({name:document.getElementById('custom-name').value.trim()||h,hex:h.startsWith('#')?h:'#'+h,weight:50});render();}});
      document.querySelector('[data-mixer-order]')?.addEventListener('click',()=>{const p=productById('plastic-emulsion')||PRODUCTS[0],m=closestMatch(blendedColor());addToCart(p,m.shade,p.sizes[0],'Custom blend');});
    }
    render();
  </script>
</body>
</html>
